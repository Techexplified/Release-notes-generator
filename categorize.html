<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Notes Generator - Categorize &amp; Configure</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
  </head>
  <body>
    <div class="wizard-layout">
      <!-- App Header Component -->
      <div id="header-root"></div>

      <!-- Stepper Component (Step 2 Active) -->
      <div id="stepper-root"></div>

      <!-- Page Intro Heading -->
      <section class="wizard-page-intro">
        <h2 class="page-title">Categorize &amp; Configure</h2>
        <p class="page-subtitle">Group the selected cards and set release details.</p>
      </section>

      <!-- Main Body: Two Columns -->
      <main id="wizard-body-main" class="wizard-body">
        <!-- Left Column: Release Details Form -->
        <aside class="wizard-sidebar" aria-label="Release details configuration" style="width: 250px; min-width: 230px;">
          <h3 class="sidebar-heading">Release details</h3>

          <!-- Release Title -->
          <div class="form-group">
            <label for="release-title-input" class="form-label">Release title *</label>
            <input
              type="text"
              id="release-title-input"
              class="form-input"
              maxlength="100"
              required
              aria-required="true"
              placeholder="e.g. Product Update"
            />
            <p id="title-helper-text" class="form-helper-text">Shown as the heading of your release notes.</p>
            <div id="title-error" class="form-error-text" role="alert" aria-live="assertive"></div>
          </div>

          <!-- Version -->
          <div class="form-group">
            <label for="release-version-input" class="form-label">Version (optional)</label>
            <input
              type="text"
              id="release-version-input"
              class="form-input"
              maxlength="30"
              placeholder="e.g. v2.3.0"
            />
          </div>

          <!-- Release Date -->
          <div class="form-group">
            <label for="release-date-input" class="form-label">Release date</label>
            <div class="select-wrapper date-picker-wrapper" id="date-picker-trigger" tabindex="0" role="button" aria-haspopup="dialog" aria-label="Select release date">
              <span class="select-icon-left" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </span>
              <span id="date-display-text" class="custom-select has-left-icon date-display-text"></span>
              <input
                type="date"
                id="release-date-input"
                class="native-date-overlay"
                required
                aria-required="true"
                tabindex="-1"
              />
            </div>
            <div id="date-error" class="form-error-text" role="alert" aria-live="assertive"></div>
          </div>
        </aside>

        <!-- Right Column: Categorization Rows -->
        <section class="wizard-content" aria-label="Categorize cards">
          <header class="content-header" style="flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 16px;">
            <div class="content-heading-group">
              <h3 class="content-title">Categorize cards <span id="total-cards-count" class="selected-count-badge" aria-live="polite">(0)</span></h3>
            </div>
            <p class="content-subtitle">Assign cards to categories. You can use existing labels or choose manually.</p>
          </header>

          <div id="categorize-cards-container" class="categorize-scroll-box" role="region" aria-label="Category groups">
            <!-- Dynamically populated category rows or skeleton/empty state -->
          </div>

          <!-- Inline error alert if any cards are in Unassigned -->
          <div id="category-error-container" class="category-validation-error" style="display: none;" role="alert" aria-live="assertive"></div>
        </section>
      </main>

      <!-- Wizard Footer -->
      <footer class="wizard-footer" style="justify-content: space-between;">
        <button id="btn-back" type="button" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back</span>
        </button>

        <button id="btn-next" type="button" class="btn-primary">
          <span>Next: Preview &amp; Edit</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </footer>
    </div>

    <!-- Live Accessibility Announcements -->
    <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Trello Power-Up library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <!-- Step 2 Categorize Logic -->
    <script type="module" src="./src/categorize.js"></script>
  </body>
</html>
