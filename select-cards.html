<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Notes Generator - Select Cards</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
  </head>
  <body>
    <div class="wizard-layout">
      <!-- App Header Component -->
      <div id="header-root"></div>

      <!-- Stepper Component -->
      <div id="stepper-root"></div>

      <!-- Page Intro Heading -->
      <section class="wizard-page-intro">
        <h2 class="page-title">Select Cards</h2>
        <p class="page-subtitle">Choose the source list and cards to include in this release.</p>
      </section>

      <!-- Main Body: Two Columns -->
      <main class="wizard-body">
        <!-- Left Column: Source List and Date Filter -->
        <aside class="wizard-sidebar" aria-label="Filters and list selection">
          <div class="form-group">
            <label for="list-select" class="form-label">Select a list</label>
            <div class="select-wrapper">
              <select id="list-select" class="custom-select" aria-label="Select source list">
                <!-- Dynamically populated from getLists -->
              </select>
              <span class="select-chevron" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label for="filter-select" class="form-label">Filter (optional)</label>
            <div class="select-wrapper">
              <span class="select-icon-left" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </span>
              <select id="filter-select" class="custom-select has-left-icon" aria-label="Filter cards by completion date">
                <!-- Dynamically populated from FILTERS config -->
              </select>
              <span class="select-chevron" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
            </div>
          </div>
        </aside>

        <!-- Right Column: Card Selection List -->
        <section class="wizard-content" aria-label="Card list">
          <header class="content-header">
            <div class="content-heading-group">
              <h3 class="content-title">Select cards to include</h3>
              <span id="selected-count-badge" class="selected-count-badge" aria-live="polite">(0 selected)</span>
            </div>
            <div class="select-all-group">
              <input type="checkbox" id="select-all-checkbox" class="native-checkbox" aria-label="Select all displayed cards" />
              <label for="select-all-checkbox" class="select-all-label">Select all</label>
            </div>
          </header>

          <div id="card-list-box" class="card-list-box" role="region" aria-label="Cards to select">
            <!-- Dynamically populated list of cards, skeletons, or empty states -->
          </div>
        </section>
      </main>

      <!-- Wizard Footer -->
      <footer class="wizard-footer">
        <button id="btn-next" type="button" class="btn-primary" disabled aria-disabled="true" title="Select at least one card">
          <span>Next: Categorize</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </footer>
    </div>

    <!-- Trello Power-Up library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <!-- Step 1 Logic -->
    <script type="module" src="./src/select-cards.js"></script>
  </body>
</html>
