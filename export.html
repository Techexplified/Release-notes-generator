<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Notes Generator - Export</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/templates.css" />
    <link rel="stylesheet" href="./src/styles/export.css" />
  </head>
  <body>
    <div class="wizard-layout">
      <!-- App Header Component -->
      <div id="header-root"></div>

      <!-- Stepper Component (Step 4 Active) -->
      <div id="stepper-root"></div>

      <!-- Page Intro Heading -->
      <section class="wizard-page-intro">
        <h2 class="page-title">Export Release Notes</h2>
        <p class="page-subtitle">Choose a format to share your release notes.</p>
      </section>

      <!-- Main Body: Two Columns -->
      <main id="export-body-main" class="wizard-body export-layout">
        <!-- Left Column: Export Formats -->
        <aside class="export-sidebar" aria-label="Export format selection">
          <fieldset class="format-fieldset" style="border: none; padding: 0; margin: 0;">
            <legend class="sidebar-heading" style="margin-bottom: 12px;">Export format</legend>
            <div id="format-options-container" class="format-radiogroup" role="radiogroup" aria-label="Export formats">
              <!-- Dynamically populated from EXPORT_FORMATS config -->
            </div>
          </fieldset>
        </aside>

        <!-- Right Column: Live Export Preview -->
        <section class="export-content" aria-label="Export preview">
          <header class="content-header" style="margin-bottom: 12px; align-items: center; justify-content: space-between;">
            <h3 class="content-title">Preview</h3>
            <div id="export-status-banner" class="export-status-banner" style="display: none;" role="status" aria-live="polite"></div>
          </header>

          <div
            id="export-preview-container"
            class="export-preview-frame"
            role="region"
            aria-label="Preview of the export"
            tabindex="0"
          >
            <!-- Rendered preview content -->
          </div>
        </section>
      </main>

      <!-- Wizard Footer -->
      <footer id="export-footer" class="wizard-footer" style="justify-content: space-between;">
        <button id="btn-back" type="button" class="btn-secondary" aria-label="Go back to Preview & Edit">
          <span class="btn-icon-left" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </span>
          <span>Back</span>
        </button>

        <div class="footer-actions-right">
          <button id="btn-copy" type="button" class="btn-secondary" title="Copy to clipboard">
            <span id="copy-icon-slot" class="btn-icon-left" aria-hidden="true"></span>
            <span id="copy-label-text">Copy to Clipboard</span>
          </button>

          <button id="btn-download" type="button" class="btn-primary" title="Download release notes">
            <span id="download-icon-slot" class="btn-icon-left" aria-hidden="true"></span>
            <span id="download-label-text">Download</span>
          </button>
        </div>
      </footer>
    </div>

    <!-- Live Accessibility Announcements -->
    <div id="sr-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Trello Power-Up library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <!-- Step 4 Controller Logic -->
    <script type="module" src="./src/export.js"></script>
  </body>
</html>
